<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>博士毕业大作战</title>
<style>
body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Arial', sans-serif; }
canvas { border: 4px solid #fff; background: #f0f0f0; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
#ui { position: absolute; top: 20px; color: white; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<div id="ui">
<h1>博士毕业大作战</h1>
<p>按【空格键】跳跃，躲避 Reviewer 2，拿到毕业证！</p>
</div>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 400;

let gameActive = true;
let score = 0;

// 玩家对象
const player = {
x: 50,
y: 300,
width: 40,
height: 40,
dy: 0,
jumpForce: 12,
gravity: 0.6,
grounded: false
};

// 障碍物（Reviewer 2 / Bug / 拒稿信）
const obstacles = [];
const certificates = [];

function spawnObstacle() {
if (gameActive) {
obstacles.push({ x: canvas.width, y: 310, width: 60, height: 40, speed: 5 + (score * 0.1) });
setTimeout(spawnObstacle, Math.random() * 2000 + 1000);
}
}

function update() {
if (!gameActive) return;

// 重力逻辑
player.dy += player.gravity;
player.y += player.dy;

if (player.y + player.height > 350) {
player.y = 350 - player.height;
player.dy = 0;
player.grounded = true;
}

// 移动障碍物
obstacles.forEach((obs, index) => {
obs.x -= obs.speed;
// 碰撞检测
if (player.x < obs.x + obs.width && player.x + player.width > obs.x &&
player.y < obs.y + obs.height && player.y + player.height > obs.y) {
gameOver();
}
if (obs.x + obs.width < 0) {
obstacles.splice(index, 1);
score++;
if (score === 10) win(); // 拿到10分算毕业
}
});

draw();
requestAnimationFrame(update);
}

function draw() {
ctx.clearRect(0, 0, canvas.width, canvas.height);

// 画地面
ctx.fillStyle = '#666';
ctx.fillRect(0, 350, canvas.width, 50);

// 画玩家 (可以用朋友的头像代替这个方块)
ctx.fillStyle = '#007bff';
ctx.fillRect(player.x, player.y, player.width, player.height);
ctx.fillStyle = 'white';
ctx.fillText("PHD", player.x + 5, player.y + 25);

// 画障碍物
ctx.fillStyle = '#ff4757';
obstacles.forEach(obs => {
ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
ctx.fillStyle = 'white';
ctx.fillText("Reviewer 2", obs.x + 2, obs.y + 25);
ctx.fillStyle = '#ff4757';
});

// 画分数
ctx.fillStyle = '#333';
ctx.font = '20px Arial';
ctx.fillText(`已完成章节: ${score} / 10`, 20, 40);
}

function gameOver() {
gameActive = false;
alert("被 Reviewer 2 拒稿了！别灰心，重新再来。");
location.reload();
}

function win() {
gameActive = false;
// 这里可以触发你之前的烟花效果！
alert("恭喜毕业！你是最棒的博士！");
// 可以跳转到你准备的祝福页面或视频
}

window.addEventListener('keydown', (e) => {
if (e.code === 'Space' && player.grounded) {
player.dy = -player.jumpForce;
player.grounded = false;
}
});

spawnObstacle();
update();
</script>
</body>
</html>
